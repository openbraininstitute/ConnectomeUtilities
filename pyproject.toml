[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "Connectome-Utilities"
dynamic = ["version"]
authors = [
  {name = "Open Brain Institute"},
  {name = "Blue Brain Project, EPFL"},
]
description = "Complex network representation and analysis layer"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=2.0.0",
    "h5py>=3.6.0",
    "pandas>=2.0.0",
    "tables>=3.6",
    "scipy>=1.8.0",
    "tqdm>=4.50.0",
    "lazy>=1.4",
    "scikit-learn>=1.0",
    "libsonata>=0.1.10",
    "bluepysnap>=3.0.0",
    "voxcell>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/openbraininstitute/ConnectomeUtilities"
"Bug Tracker" = "https://github.com/openbraininstitute/ConnectomeUtilities/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools_scm]
